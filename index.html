<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="每日记录" />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="manifest" href="./manifest.json" />
  <title>每日记录</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      padding-top: max(1.25rem, env(safe-area-inset-top));
      padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    input {
      background: transparent;
      color: inherit;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="antialiased px-4 py-6 md:px-8 max-w-5xl mx-auto space-y-5">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="text-xl">📋</span>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">每日记录</h1>
      <span class="text-xs text-slate-400 ml-1" id="sync-status">点表格可直接修改</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="addNewRow()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-white hover:bg-slate-800 shadow-xs transition cursor-pointer">
        + 新增一天
      </button>
      <button onclick="syncFromCloud()" class="px-3 py-2 rounded-xl text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 shadow-xs transition cursor-pointer">
        ↻ 同步
      </button>
    </div>
  </div>

  <!-- 4 Clean Light Summary Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3.5">
    <!-- Morning Weight -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-xs">
      <div class="flex items-center justify-between text-xs font-medium text-slate-500">
        <span>🌅 早起体重</span>
        <span class="px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-600 font-semibold" id="stat-diff">↓ 0.4 kg</span>
      </div>
      <div class="mt-2 flex items-baseline gap-1">
        <span class="text-2xl font-bold text-slate-900 tracking-tight" id="stat-am">90.8</span>
        <span class="text-xs text-slate-400">kg</span>
      </div>
    </div>

    <!-- Night Weight -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-xs">
      <div class="flex items-center justify-between text-xs font-medium text-slate-500">
        <span>🌙 睡前体重</span>
        <span class="text-slate-400">目标 75.0</span>
      </div>
      <div class="mt-2 flex items-baseline gap-1">
        <span class="text-2xl font-bold text-slate-900 tracking-tight" id="stat-pm">91.2</span>
        <span class="text-xs text-slate-400">kg</span>
      </div>
    </div>

    <!-- Water Counter -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-xs">
      <div class="flex items-center justify-between text-xs font-medium text-slate-500">
        <span>💧 今日饮水</span>
        <span class="text-sky-600 font-semibold" id="stat-water-ml">500 ml</span>
      </div>
      <div class="mt-2 flex items-center justify-between">
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-bold text-slate-900 tracking-tight" id="stat-water">1</span>
          <span class="text-xs text-slate-400">/ 4 杯</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="changeWater(-0.5)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold flex items-center justify-center cursor-pointer transition">-</button>
          <button onclick="changeWater(0.5)" class="w-7 h-7 rounded-lg bg-sky-500 hover:bg-sky-600 text-white text-sm font-bold flex items-center justify-center cursor-pointer shadow-xs transition">+</button>
        </div>
      </div>
    </div>

    <!-- Supplements -->
    <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-xs">
      <div class="text-xs font-medium text-slate-500">💊 今日补剂</div>
      <div class="mt-2.5 flex items-center gap-1.5 flex-wrap" id="supp-container"></div>
    </div>
  </div>

  <!-- Clean Weight Trend Chart -->
  <div class="bg-white border border-slate-200/90 rounded-2xl p-4 md:p-5 shadow-xs">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-semibold text-slate-600">📈 体重变化趋势 (kg)</span>
      <div class="flex items-center gap-4 text-xs text-slate-500">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>早起空腹</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>夜间睡前</span>
      </div>
    </div>
    <canvas id="chart" height="150" class="w-full"></canvas>
  </div>

  <!-- Desktop Table -->
  <div class="hidden md:block bg-white border border-slate-200/90 rounded-2xl shadow-xs overflow-hidden">
    <table class="w-full text-left border-collapse text-sm table-fixed">
      <thead>
        <tr class="border-b border-slate-100 text-xs text-slate-500 bg-slate-50/70">
          <th class="py-3 px-3 font-semibold w-[76px]">📅 日期</th>
          <th class="py-3 px-2 font-semibold w-[76px]">🌅 早(kg)</th>
          <th class="py-3 px-2 font-semibold w-[76px]">🌙 晚(kg)</th>
          <th class="py-3 px-3 font-semibold">🥚 早饭</th>
          <th class="py-3 px-3 font-semibold">🍱 午饭</th>
          <th class="py-3 px-3 font-semibold">🥗 晚饭 / 加餐</th>
          <th class="py-3 px-2 font-semibold w-[72px]">💧 饮水</th>
          <th class="py-3 px-3 font-semibold w-[130px]">🏸 活动量</th>
        </tr>
      </thead>
      <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>

  <!-- Mobile Cards (iPhone) -->
  <div class="md:hidden space-y-3" id="mobile-list"></div>

  <script>
    const STORAGE_KEY = 'daily_fit_v3_light';
    const SUPP_LIST = [
      { id: '蛋白粉', icon: '🍫' },
      { id: '茶氨酸', icon: '🍵' },
      { id: '甘氨酸镁', icon: '✨' }
    ];

    const DEFAULT_DATA = [
      {
        date: '2026-11-03',
        amWeight: null,
        pmWeight: 91.2,
        breakfast: '-',
        lunch: '常规午餐',
        dinner: '沙县鸡腿饭(去皮·半份饭) + 2个卤蛋',
        water: 2,
        activity: '羽毛球',
        supplements: ['甘氨酸镁']
      },
      {
        date: '2026-11-04',
        amWeight: 90.8,
        pmWeight: null,
        breakfast: '2个茶叶蛋 + 光明优倍',
        lunch: 'Subway 照烧鸡鸡蛋双拼(无酱)',
        dinner: '',
        water: 1,
        activity: '具身实验采数据',
        supplements: []
      }
    ];

    let rows = [];

    async function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { rows = JSON.parse(saved); } catch (e) {}
      }
      if (!rows || !rows.length) {
        await syncFromCloud(true);
      } else {
        render();
        try {
          const res = await fetch('./data.json?t=' + Date.now());
          if (res.ok) {
            const remote = await res.json();
            if (Array.isArray(remote) && remote.length >= rows.length) {
              rows = remote;
              saveLocal();
              render();
            }
          }
        } catch (e) {}
      }
    }

    async function syncFromCloud(silent) {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (res.ok) {
          const remote = await res.json();
          if (Array.isArray(remote) && remote.length > 0) {
            rows = remote;
            saveLocal();
            render();
            if (!silent) showStatus('✓ 已同步');
            return;
          }
        }
      } catch (e) {}
      if (!rows || !rows.length) {
        rows = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveLocal();
        render();
      }
    }

    function saveLocal() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch (e) {}
      fetch('/api/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(rows)
      }).catch(() => {});
      showStatus('✓ 已自动保存');
    }

    function showStatus(msg) {
      const el = document.getElementById('sync-status');
      if (el) el.textContent = msg;
    }

    function todayRow() {
      return rows[rows.length - 1];
    }

    function changeWater(delta) {
      const r = todayRow();
      if (!r) return;
      r.water = Math.max(0, Math.round(((r.water || 0) + delta) * 2) / 2);
      saveLocal();
      render();
    }

    function toggleSupp(name) {
      const r = todayRow();
      if (!r) return;
      if (!Array.isArray(r.supplements)) r.supplements = [];
      const idx = r.supplements.indexOf(name);
      if (idx >= 0) r.supplements.splice(idx, 1);
      else r.supplements.push(name);
      saveLocal();
      render();
    }

    function updateField(index, field, val) {
      const r = rows[index];
      if (!r) return;
      if (field === 'amWeight' || field === 'pmWeight') {
        const num = parseFloat(val);
        r[field] = isNaN(num) ? null : num;
      } else if (field === 'water') {
        const num = parseFloat(val);
        r[field] = isNaN(num) ? 0 : num;
      } else {
        r[field] = val;
      }
      saveLocal();
      renderStatsAndChart();
    }

    function addNewRow() {
      const last = todayRow();
      let nextDate = new Date().toISOString().slice(0, 10);
      if (last && last.date >= nextDate) {
        const d = new Date(last.date + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        nextDate = d.toISOString().slice(0, 10);
      }
      rows.push({
        date: nextDate,
        amWeight: null,
        pmWeight: null,
        breakfast: '',
        lunch: '',
        dinner: '',
        water: 0,
        activity: '',
        supplements: []
      });
      saveLocal();
      render();
    }

    function renderStatsAndChart() {
      const r = todayRow();
      if (!r) return;

      const latestAm = [...rows].reverse().find(x => x.amWeight != null)?.amWeight ?? 90.8;
      const latestPm = [...rows].reverse().find(x => x.pmWeight != null)?.pmWeight ?? 91.2;

      document.getElementById('stat-am').textContent = latestAm.toFixed(1);
      document.getElementById('stat-pm').textContent = latestPm.toFixed(1);
      const diff = (91.2 - latestAm).toFixed(1);
      document.getElementById('stat-diff').textContent = (diff >= 0 ? '↓ ' : '↑ ') + Math.abs(diff) + ' kg';

      const wCups = r.water ?? 0;
      document.getElementById('stat-water').textContent = wCups;
      document.getElementById('stat-water-ml').textContent = Math.round(wCups * 500) + ' ml';

      const suppEl = document.getElementById('supp-container');
      suppEl.innerHTML = SUPP_LIST.map(s => {
        const active = (r.supplements || []).includes(s.id);
        return `<button onclick="toggleSupp('${s.id}')" class="px-2.5 py-1 rounded-lg text-xs font-medium transition cursor-pointer ${
          active
            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold'
            : 'bg-slate-100 text-slate-500 border border-transparent hover:bg-slate-200/70'
        }">${s.icon} ${s.id}</button>`;
      }).join('');

      drawChart();
    }

    function render() {
      renderStatsAndChart();

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = rows.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => `
        <tr class="hover:bg-slate-50/80 transition align-top">
          <td class="py-3 px-3 text-xs font-semibold text-slate-500 font-mono whitespace-nowrap">${r.date.slice(5)}</td>
          <td class="py-2.5 px-2">
            <input type="number" step="0.1" value="${r.amWeight ?? ''}" placeholder="-"
              onchange="updateField(${i}, 'amWeight', this.value)"
              class="w-14 font-bold text-emerald-600 placeholder-slate-300 focus:bg-slate-100 rounded-md px-1 py-0.5" />
          </td>
          <td class="py-2.5 px-2">
            <input type="number" step="0.1" value="${r.pmWeight ?? ''}" placeholder="-"
              onchange="updateField(${i}, 'pmWeight', this.value)"
              class="w-14 font-bold text-blue-600 placeholder-slate-300 focus:bg-slate-100 rounded-md px-1 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <div contenteditable="true" data-placeholder="点击输入..."
              onblur="updateField(${i}, 'breakfast', this.innerText.trim())"
              class="w-full text-slate-700 leading-relaxed break-words whitespace-pre-wrap focus:bg-slate-100 focus:outline-none rounded-md px-1.5 py-0.5 min-h-[24px] empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300">${r.breakfast || ''}</div>
          </td>
          <td class="py-2.5 px-3">
            <div contenteditable="true" data-placeholder="点击输入..."
              onblur="updateField(${i}, 'lunch', this.innerText.trim())"
              class="w-full text-slate-700 leading-relaxed break-words whitespace-pre-wrap focus:bg-slate-100 focus:outline-none rounded-md px-1.5 py-0.5 min-h-[24px] empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300">${r.lunch || ''}</div>
          </td>
          <td class="py-2.5 px-3">
            <div contenteditable="true" data-placeholder="点击输入..."
              onblur="updateField(${i}, 'dinner', this.innerText.trim())"
              class="w-full text-slate-700 leading-relaxed break-words whitespace-pre-wrap focus:bg-slate-100 focus:outline-none rounded-md px-1.5 py-0.5 min-h-[24px] empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300">${r.dinner || ''}</div>
          </td>
          <td class="py-2.5 px-2 whitespace-nowrap">
            <input type="number" step="0.5" value="${r.water ?? 0}"
              onchange="updateField(${i}, 'water', this.value)"
              class="w-10 font-semibold text-sky-600 focus:bg-slate-100 rounded-md px-1 py-0.5 text-center" /><span class="text-xs text-slate-400">杯</span>
          </td>
          <td class="py-2.5 px-3">
            <div contenteditable="true" data-placeholder="点击输入..."
              onblur="updateField(${i}, 'activity', this.innerText.trim())"
              class="w-full text-slate-700 leading-relaxed break-words whitespace-pre-wrap focus:bg-slate-100 focus:outline-none rounded-md px-1.5 py-0.5 min-h-[24px] empty:before:content-[attr(data-placeholder)] empty:before:text-slate-300">${r.activity || ''}</div>
          </td>
        </tr>
      `).join('');

      const mlist = document.getElementById('mobile-list');
      mlist.innerHTML = rows.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => `
        <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-xs space-y-3 text-xs">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <span class="font-bold text-sm text-slate-800 font-mono">📅 ${r.date}</span>
            <span class="px-2 py-0.5 rounded-md bg-sky-50 text-sky-600 font-semibold">💧 饮水 ${r.water ?? 0} 杯</span>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-100">
              <span class="text-slate-500">🌅 早 (kg)</span>
              <input type="number" step="0.1" value="${r.amWeight ?? ''}" placeholder="-"
                onchange="updateField(${i}, 'amWeight', this.value)"
                class="w-14 text-right font-bold text-emerald-600 text-sm" />
            </div>
            <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl border border-slate-100">
              <span class="text-slate-500">🌙 晚 (kg)</span>
              <input type="number" step="0.1" value="${r.pmWeight ?? ''}" placeholder="-"
                onchange="updateField(${i}, 'pmWeight', this.value)"
                class="w-14 text-right font-bold text-blue-600 text-sm" />
            </div>
          </div>
          <div class="space-y-1.5 pt-1">
            <div class="flex items-center gap-2">
              <span class="text-slate-400 w-12 shrink-0">🥚 早饭</span>
              <input type="text" value="${r.breakfast || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'breakfast', this.value)"
                class="w-full text-slate-700 border-b border-slate-100 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-slate-400 w-12 shrink-0">🍱 午饭</span>
              <input type="text" value="${r.lunch || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'lunch', this.value)"
                class="w-full text-slate-700 border-b border-slate-100 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-slate-400 w-12 shrink-0">🥗 晚饭</span>
              <input type="text" value="${r.dinner || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'dinner', this.value)"
                class="w-full text-slate-700 border-b border-slate-100 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-slate-400 w-12 shrink-0">🏸 活动</span>
              <input type="text" value="${r.activity || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'activity', this.value)"
                class="w-full text-slate-700 py-1" />
            </div>
          </div>
        </div>
      `).join('');
    }

    function drawChart() {
      const canvas = document.getElementById('chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.getBoundingClientRect().width || 600;
      const h = 150;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const padL = 42, padR = 24, padT = 22, padB = 26;
      const pw = w - padL - padR;
      const ph = h - padT - padB;

      const vals = [];
      rows.forEach(r => {
        if (r.amWeight != null) vals.push(r.amWeight);
        if (r.pmWeight != null) vals.push(r.pmWeight);
      });
      const minW = Math.floor(Math.min(...vals, 89.5) - 0.5);
      const maxW = Math.ceil(Math.max(...vals, 91.5) + 0.5);

      const yOf = v => padT + ph - ((v - minW) / (maxW - minW)) * ph;
      const n = Math.max(rows.length, 5);
      const xOf = idx => padL + (idx / (n - 1)) * pw;

      ctx.font = '12px -apple-system, sans-serif';
      [minW, (minW + maxW) / 2, maxW].forEach(val => {
        const y = yOf(val);
        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'right';
        ctx.fillText(val.toFixed(1), padL - 8, y + 4);
      });

      rows.forEach((r, i) => {
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.fillText(r.date.slice(5), xOf(i), h - 6);
      });

      // PM Weight (Blue)
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      let sPm = false;
      rows.forEach((r, i) => {
        if (r.pmWeight != null) {
          const x = xOf(i), y = yOf(r.pmWeight);
          if (!sPm) { ctx.moveTo(x, y); sPm = true; } else ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      rows.forEach((r, i) => {
        if (r.pmWeight != null) {
          const x = xOf(i), y = yOf(r.pmWeight);
          ctx.fillStyle = '#3b82f6';
          ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillText(r.pmWeight.toFixed(1), x, y - 9);
        }
      });

      // AM Weight (Emerald)
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      let sAm = false;
      rows.forEach((r, i) => {
        if (r.amWeight != null) {
          const x = xOf(i), y = yOf(r.amWeight);
          if (!sAm) { ctx.moveTo(x, y); sAm = true; } else ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      rows.forEach((r, i) => {
        if (r.amWeight != null) {
          const x = xOf(i), y = yOf(r.amWeight);
          ctx.fillStyle = '#10b981';
          ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillText(r.amWeight.toFixed(1), x, y + 17);
        }
      });
    }

    window.addEventListener('resize', drawChart);
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
