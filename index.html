<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="每日记录" />
  <meta name="theme-color" content="#09090b" />
  <link rel="manifest" href="./manifest.json" />
  <title>每日记录</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    input, textarea {
      background: transparent;
      color: inherit;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="antialiased px-4 py-6 md:px-8 max-w-5xl mx-auto space-y-6">

  <!-- Minimalist Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-baseline gap-3">
      <h1 class="text-xl font-semibold tracking-tight">每日记录</h1>
      <span class="text-xs text-zinc-400" id="sync-status">点击表格可直接修改</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="addNewRow()" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-zinc-100 text-zinc-900 hover:bg-white transition cursor-pointer">
        + 新增一天
      </button>
      <button onclick="syncFromCloud()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 text-zinc-300 border border-zinc-800 hover:border-zinc-700 transition cursor-pointer">
        同步
      </button>
    </div>
  </div>

  <!-- Compact Top Strip -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <!-- Morning Weight -->
    <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4">
      <div class="text-xs text-zinc-400">当前早起体重</div>
      <div class="mt-1.5 flex items-baseline gap-1.5">
        <span class="text-2xl font-semibold tracking-tight" id="stat-am">90.8</span>
        <span class="text-xs text-zinc-500">kg</span>
        <span class="text-xs text-emerald-400 ml-auto" id="stat-diff">-0.4 kg</span>
      </div>
    </div>

    <!-- Night Weight -->
    <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4">
      <div class="text-xs text-zinc-400">昨晚睡前体重</div>
      <div class="mt-1.5 flex items-baseline gap-1.5">
        <span class="text-2xl font-semibold tracking-tight" id="stat-pm">91.2</span>
        <span class="text-xs text-zinc-500">kg</span>
        <span class="text-xs text-zinc-500 ml-auto">目标 75.0</span>
      </div>
    </div>

    <!-- Water Counter -->
    <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4">
      <div class="text-xs text-zinc-400">今日喝水</div>
      <div class="mt-1.5 flex items-center justify-between">
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-semibold tracking-tight" id="stat-water">1</span>
          <span class="text-xs text-zinc-500">/ 4 杯</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="changeWater(-1)" class="w-7 h-7 rounded-md bg-zinc-800 hover:bg-zinc-700 text-sm flex items-center justify-center cursor-pointer">-</button>
          <button onclick="changeWater(1)" class="w-7 h-7 rounded-md bg-zinc-100 text-zinc-900 hover:bg-white text-sm font-medium flex items-center justify-center cursor-pointer">+</button>
        </div>
      </div>
    </div>

    <!-- Supplements Quick Check -->
    <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4">
      <div class="text-xs text-zinc-400">今日补剂</div>
      <div class="mt-2 flex items-center gap-1.5 flex-wrap" id="supp-container">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Minimalist Weight Chart -->
  <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-medium text-zinc-400">体重趋势 (kg)</span>
      <div class="flex items-center gap-4 text-xs text-zinc-400">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>早</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-sky-400"></span>晚</span>
      </div>
    </div>
    <canvas id="chart" height="150" class="w-full"></canvas>
  </div>

  <!-- Direct Editable Table (PC) -->
  <div class="hidden md:block bg-[#121215] border border-zinc-800/80 rounded-xl overflow-hidden">
    <table class="w-full text-left border-collapse text-sm">
      <thead>
        <tr class="border-b border-zinc-800 text-xs text-zinc-400 bg-zinc-900/40">
          <th class="py-3 px-4 font-medium w-28">日期</th>
          <th class="py-3 px-3 font-medium w-20">早 (kg)</th>
          <th class="py-3 px-3 font-medium w-20">晚 (kg)</th>
          <th class="py-3 px-3 font-medium">早饭</th>
          <th class="py-3 px-3 font-medium">午饭</th>
          <th class="py-3 px-3 font-medium">晚饭 / 加餐</th>
          <th class="py-3 px-3 font-medium w-20">饮水</th>
          <th class="py-3 px-4 font-medium">活动量</th>
        </tr>
      </thead>
      <tbody id="table-body" class="divide-y divide-zinc-800/60">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>

  <!-- Mobile Clean List (iPhone) -->
  <div class="md:hidden space-y-3" id="mobile-list">
    <!-- Populated by JS -->
  </div>

  <script>
    const STORAGE_KEY = 'daily_fit_v2';
    const SUPP_LIST = ['蛋白粉', '茶氨酸', '甘氨酸镁'];

    const DEFAULT_DATA = [
      {
        date: '2026-11-03',
        amWeight: null,
        pmWeight: 91.2,
        breakfast: '-',
        lunch: '常规午餐',
        dinner: '沙县鸡腿饭(去皮·半份饭) + 2个卤蛋',
        water: 2,
        activity: '羽毛球',
        supplements: ['甘氨酸镁']
      },
      {
        date: '2026-11-04',
        amWeight: 90.8,
        pmWeight: null,
        breakfast: '2个茶叶蛋 + 光明优倍',
        lunch: 'Subway 照烧鸡鸡蛋双拼(无酱)',
        dinner: '',
        water: 1,
        activity: '具身实验采数据',
        supplements: []
      }
    ];

    let rows = [];

    async function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { rows = JSON.parse(saved); } catch (e) {}
      }
      if (!rows || !rows.length) {
        await syncFromCloud(true);
      } else {
        render();
        // Background fetch if remote has more rows
        try {
          const res = await fetch('./data.json?t=' + Date.now());
          if (res.ok) {
            const remote = await res.json();
            if (Array.isArray(remote) && remote.length >= rows.length) {
              rows = remote;
              saveLocal();
              render();
            }
          }
        } catch (e) {}
      }
    }

    async function syncFromCloud(silent) {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (res.ok) {
          const remote = await res.json();
          if (Array.isArray(remote) && remote.length > 0) {
            rows = remote;
            saveLocal();
            render();
            if (!silent) showStatus('已同步最新数据');
            return;
          }
        }
      } catch (e) {}
      if (!rows || !rows.length) {
        rows = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveLocal();
        render();
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
      fetch('/api/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(rows)
      }).catch(() => {});
      showStatus('已自动保存');
    }

    function showStatus(msg) {
      const el = document.getElementById('sync-status');
      if (el) el.textContent = msg;
    }

    function todayRow() {
      return rows[rows.length - 1];
    }

    function changeWater(delta) {
      const r = todayRow();
      if (!r) return;
      r.water = Math.max(0, (r.water || 0) + delta);
      saveLocal();
      render();
    }

    function toggleSupp(name) {
      const r = todayRow();
      if (!r) return;
      if (!Array.isArray(r.supplements)) r.supplements = [];
      const idx = r.supplements.indexOf(name);
      if (idx >= 0) r.supplements.splice(idx, 1);
      else r.supplements.push(name);
      saveLocal();
      render();
    }

    function updateField(index, field, val) {
      const r = rows[index];
      if (!r) return;
      if (field === 'amWeight' || field === 'pmWeight') {
        const num = parseFloat(val);
        r[field] = isNaN(num) ? null : num;
      } else if (field === 'water') {
        const num = parseFloat(val);
        r[field] = isNaN(num) ? 0 : num;
      } else {
        r[field] = val;
      }
      saveLocal();
      renderStatsAndChart();
    }

    function addNewRow() {
      const last = todayRow();
      let nextDate = new Date().toISOString().slice(0, 10);
      if (last && last.date >= nextDate) {
        const d = new Date(last.date + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        nextDate = d.toISOString().slice(0, 10);
      }
      rows.push({
        date: nextDate,
        amWeight: null,
        pmWeight: null,
        breakfast: '',
        lunch: '',
        dinner: '',
        water: 0,
        activity: '',
        supplements: []
      });
      saveLocal();
      render();
    }

    function renderStatsAndChart() {
      const r = todayRow();
      if (!r) return;

      const latestAm = [...rows].reverse().find(x => x.amWeight != null)?.amWeight ?? 90.8;
      const latestPm = [...rows].reverse().find(x => x.pmWeight != null)?.pmWeight ?? 91.2;

      document.getElementById('stat-am').textContent = latestAm.toFixed(1);
      document.getElementById('stat-pm').textContent = latestPm.toFixed(1);
      const diff = (91.2 - latestAm).toFixed(1);
      document.getElementById('stat-diff').textContent = (diff >= 0 ? '-' : '+') + Math.abs(diff) + ' kg';
      document.getElementById('stat-water').textContent = r.water ?? 0;

      const suppEl = document.getElementById('supp-container');
      suppEl.innerHTML = SUPP_LIST.map(s => {
        const active = (r.supplements || []).includes(s);
        return `<button onclick="toggleSupp('${s}')" class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer ${
          active ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-zinc-800/80 text-zinc-400 border border-zinc-700/50'
        }">${active ? '✓ ' : ''}${s}</button>`;
      }).join('');

      drawChart();
    }

    function render() {
      renderStatsAndChart();

      // Desktop table (newest first)
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = rows.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => `
        <tr class="hover:bg-zinc-900/30 transition">
          <td class="py-2.5 px-4 text-xs text-zinc-400 font-mono whitespace-nowrap">${r.date.slice(5)}</td>
          <td class="py-2.5 px-3">
            <input type="number" step="0.1" value="${r.amWeight ?? ''}" placeholder="-"
              onchange="updateField(${i}, 'amWeight', this.value)"
              class="w-16 font-semibold text-emerald-400 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <input type="number" step="0.1" value="${r.pmWeight ?? ''}" placeholder="-"
              onchange="updateField(${i}, 'pmWeight', this.value)"
              class="w-16 font-semibold text-sky-400 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <input type="text" value="${r.breakfast || ''}" placeholder="输入早饭..."
              onchange="updateField(${i}, 'breakfast', this.value)"
              class="w-full text-zinc-200 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1.5 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <input type="text" value="${r.lunch || ''}" placeholder="输入午饭..."
              onchange="updateField(${i}, 'lunch', this.value)"
              class="w-full text-zinc-200 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1.5 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <input type="text" value="${r.dinner || ''}" placeholder="输入晚饭/加餐..."
              onchange="updateField(${i}, 'dinner', this.value)"
              class="w-full text-zinc-200 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1.5 py-0.5" />
          </td>
          <td class="py-2.5 px-3">
            <input type="number" step="0.5" value="${r.water ?? 0}"
              onchange="updateField(${i}, 'water', this.value)"
              class="w-14 text-zinc-300 focus:bg-zinc-800 rounded px-1 py-0.5" />
          </td>
          <td class="py-2.5 px-4">
            <input type="text" value="${r.activity || ''}" placeholder="输入活动..."
              onchange="updateField(${i}, 'activity', this.value)"
              class="w-full text-zinc-300 placeholder-zinc-600 focus:bg-zinc-800 rounded px-1.5 py-0.5" />
          </td>
        </tr>
      `).join('');

      // Mobile list (newest first)
      const mlist = document.getElementById('mobile-list');
      mlist.innerHTML = rows.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => `
        <div class="bg-[#121215] border border-zinc-800/80 rounded-xl p-4 space-y-2.5 text-xs">
          <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
            <span class="font-semibold text-sm text-zinc-200 font-mono">${r.date}</span>
            <span class="text-zinc-400">饮水 ${r.water ?? 0} 杯</span>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-0.5">
            <div class="flex items-center justify-between bg-zinc-900/70 px-3 py-2 rounded-lg">
              <span class="text-zinc-400">早 (kg)</span>
              <input type="number" step="0.1" value="${r.amWeight ?? ''}" placeholder="-"
                onchange="updateField(${i}, 'amWeight', this.value)"
                class="w-14 text-right font-semibold text-emerald-400 text-sm" />
            </div>
            <div class="flex items-center justify-between bg-zinc-900/70 px-3 py-2 rounded-lg">
              <span class="text-zinc-400">晚 (kg)</span>
              <input type="number" step="0.1" value="${r.pmWeight ?? ''}" placeholder="-"
                onchange="updateField(${i}, 'pmWeight', this.value)"
                class="w-14 text-right font-semibold text-sky-400 text-sm" />
            </div>
          </div>
          <div class="space-y-1.5 pt-1">
            <div class="flex items-center gap-2">
              <span class="text-zinc-500 w-8 shrink-0">早饭</span>
              <input type="text" value="${r.breakfast || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'breakfast', this.value)"
                class="w-full text-zinc-200 border-b border-zinc-800/60 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-zinc-500 w-8 shrink-0">午饭</span>
              <input type="text" value="${r.lunch || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'lunch', this.value)"
                class="w-full text-zinc-200 border-b border-zinc-800/60 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-zinc-500 w-8 shrink-0">晚饭</span>
              <input type="text" value="${r.dinner || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'dinner', this.value)"
                class="w-full text-zinc-200 border-b border-zinc-800/60 py-1" />
            </div>
            <div class="flex items-center gap-2">
              <span class="text-zinc-500 w-8 shrink-0">活动</span>
              <input type="text" value="${r.activity || ''}" placeholder="点击输入..."
                onchange="updateField(${i}, 'activity', this.value)"
                class="w-full text-zinc-200 py-1" />
            </div>
          </div>
        </div>
      `).join('');
    }

    function drawChart() {
      const canvas = document.getElementById('chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.getBoundingClientRect().width || 600;
      const h = 150;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const padL = 40, padR = 24, padT = 20, padB = 26;
      const pw = w - padL - padR;
      const ph = h - padT - padB;

      const vals = [];
      rows.forEach(r => {
        if (r.amWeight != null) vals.push(r.amWeight);
        if (r.pmWeight != null) vals.push(r.pmWeight);
      });
      const minW = Math.floor(Math.min(...vals, 89.5) - 0.5);
      const maxW = Math.ceil(Math.max(...vals, 91.5) + 0.5);

      const yOf = v => padT + ph - ((v - minW) / (maxW - minW)) * ph;
      const n = Math.max(rows.length, 4);
      const xOf = idx => padL + (idx / (n - 1)) * pw;

      ctx.font = '12px -apple-system, sans-serif';
      [minW, (minW + maxW) / 2, maxW].forEach(val => {
        const y = yOf(val);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.fillStyle = '#71717a';
        ctx.textAlign = 'right';
        ctx.fillText(val.toFixed(1), padL - 8, y + 4);
      });

      rows.forEach((r, i) => {
        ctx.fillStyle = '#71717a';
        ctx.textAlign = 'center';
        ctx.fillText(r.date.slice(5), xOf(i), h - 6);
      });

      // Draw PM
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      let sPm = false;
      rows.forEach((r, i) => {
        if (r.pmWeight != null) {
          const x = xOf(i), y = yOf(r.pmWeight);
          if (!sPm) { ctx.moveTo(x, y); sPm = true; } else ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      rows.forEach((r, i) => {
        if (r.pmWeight != null) {
          const x = xOf(i), y = yOf(r.pmWeight);
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillText(r.pmWeight.toFixed(1), x, y - 8);
        }
      });

      // Draw AM
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2;
      ctx.beginPath();
      let sAm = false;
      rows.forEach((r, i) => {
        if (r.amWeight != null) {
          const x = xOf(i), y = yOf(r.amWeight);
          if (!sAm) { ctx.moveTo(x, y); sAm = true; } else ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      rows.forEach((r, i) => {
        if (r.amWeight != null) {
          const x = xOf(i), y = yOf(r.amWeight);
          ctx.fillStyle = '#34d399';
          ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillText(r.amWeight.toFixed(1), x, y + 16);
        }
      });
    }

    window.addEventListener('resize', drawChart);
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
